backend:
  name: git-gateway
  branch: main

media_folder: "public/img"
public_folder: "/img"

collections:
  - name: "pizza"
    label: "Pizza"
    folder: "src/content/pizza"
    create: true
    identifier_field: "name"
    extension: "json"
    format: "json"
    fields:
      - label: "Base"
        name: "base"
        widget: "select"
        options:
          - "Tomate"
          - "Crème fraîche"
          - "Sucrée"
      - { label: "Nom", name: "name", widget: "string" }
      - { label: "Ingrédients", name: "ingredients", widget: "string" }
      - label: "Prix 26 cm"
        name: "price26"
        widget: "number"
        value_type: "float"
        step: 0.01
        required: false
        condition:
          field: "base"
          value: "Sucrée"
          operator: "!="
      - { label: "Prix 31 cm", name: "price31", widget: "number", value_type: "float", step: 0.01 }
